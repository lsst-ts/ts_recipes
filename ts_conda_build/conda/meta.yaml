package:
  name: ts-conda-build
  version: 0.5.0

build:
  noarch: generic

requirements:
  host:
    - python {{ python }}
  build:
    - python {{ python }} # [build_platform != target_platform]
  run:
    - astropy >=5
    - black =24
    - boto3 =1.34
    - flake8 =6
    - jsonschema =4
    - moto =5
    - mypy =1.11
    - numpy
    - pre-commit =3.6
    - py =1
    - pytest =8.1
    - pytest-asyncio =0.23
    - pytest-cov =4.1
    - python {{ python }}
    - pyyaml =6
    - types-pyyaml =6
