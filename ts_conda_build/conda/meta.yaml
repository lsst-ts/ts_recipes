package:
  name: ts-conda-build
  version: 0.5.5

build:
  noarch: generic

requirements:
  host:
    - python {{ python }}
  build:
    - python {{ python }} # [build_platform != target_platform]
  run:
    - astropy >=7.2
    - numpy
    - pre-commit =4.3
    - py =1
    - pytest =8.4
    - pytest-asyncio =1.2
    - pytest-cov =7
    - python {{ python }}
